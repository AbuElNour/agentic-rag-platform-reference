[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-platform-reference"
version = "1.0.0"
description = "Provider-neutral multi-agent RAG reference with trust gates, traces, memory, and evals"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AbuElNour" }]

[tool.setuptools.packages.find]
where = ["src"]

